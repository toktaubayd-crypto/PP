const kcH=()=>{const c=kc();return c?`<div class="m">Обмен в покое: <b>${Math.round(c.bmr)}</b> ккал. Суточная потребность: <b>${Math.round(c.t)}</b> ккал.<br>Цель для меню: <b>${c.k} ккал</b> в день, белок около <b>${c.pr} г</b>.<br><span class="mu">Цель зависит от выбранных ниже разделов: похудение −15%, набор массы +15%. Формула Миффлина — Сан-Жеора, расчёт ориентировочный.</span></div>`:'<p class="mu">Введите вес, рост и возраст для расчёта калорий.</p>'};
function gen(){const e=exs(),c=kc(),sp={b:.25,l:.35,d:.25,s:.15};S.menu=M.map(([k,t])=>{const p=F.filter(f=>f[0]===k&&S.gen.every(g=>f[2].split(" ").includes(g))&&!e.some(x=>f[1].toLowerCase().includes(x)));return[t,p.length?p[Math.floor(Math.random()*p.length)][1]:null,c?Math.round(c.k*sp[k]/10)*10:0]})}
const menu=()=>!(S.user||S.adm)?lock():`<h2>Ваши параметры</h2><div class="c"><div class="g"><label>Вес, кг<input id="p_w" type="number" min="20" max="300" value="${esc(S.pf.w)}"></label><label>Рост, см<input id="p_h" type="number" min="100" max="250" value="${esc(S.pf.h)}"></label><label>Возраст<input id="p_a" type="number" min="14" max="100" value="${esc(S.pf.a)}"></label><label>Пол${so("p_s",[["m","Мужской"],["f","Женский"]],S.pf.sex)}</label><label>Активность${so("p_c",[[1.2,"Сидячая"],[1.375,"Лёгкая (1–3 тренировки)"],[1.55,"Средняя (3–5 тренировок)"],[1.725,"Высокая (6–7 тренировок)"]],S.pf.act)}</label></div><label>Не люблю или не переношу (через запятую)<textarea id="p_x" rows="2" placeholder="например: лосось, творог, орехи">${esc(S.pf.ex)}</textarea></label><button class="pr" data-a="pf">Рассчитать калории</button>${kcH()}<p class="mu">Исключённые продукты не попадут в подбор меню. При аллергии или непереносимости всегда проверяйте состав блюд и советуйтесь с врачом.</p></div><h2>Подбор меню на день</h2><p class="mu">Отметьте разделы — блюда подойдут под все выбранные сразу.</p><div class="g">${D.map(d=>`<label class="c k"><input type="checkbox" data-a="gd" data-v="${d.id}" ${S.gen.includes(d.id)?"checked":""}><b>${d.i} ${esc(d.n)}</b></label>`).join("")}</div><p><button class="pr" data-a="gen">Подобрать меню</button></p>${S.menu?`<div class="c">${S.menu.map(([t,n,k])=>`<p><b>${t}:</b> ${n?esc(n)+(k?` <span class="mu">(порция ~${k} ккал)</span>`:""):'<span class="no">нет подходящего блюда для такого сочетания разделов и исключений</span>'}</p>`).join("")}</div>`:""}${S.gen.length?`<h3 style="margin-top:16px">Что не есть при выбранных разделах</h3><div>${[...new Set(S.gen.flatMap(i=>D.find(x=>x.id===i).no))].map(x=>`<span class="t no">${esc(x)}</span>`).join("")}</div><h3 style="margin-top:12px">Ограничить</h3><div>${[...new Set(S.gen.flatMap(i=>D.find(x=>x.id===i).lm))].map(x=>`<span class="t lm">${esc(x)}</span>`).join("")}</div>`:""}`;
const cab=()=>{if(S.user){const o=(ls.get("gf_u")||{})[S.user]?.orders||[];return`<h2>Кабинет: ${esc(S.user)}</h2><div class="c"><h3>Мои заказы</h3>${o.length?o.map(x=>`<p>${esc(x.d)} — ${esc(x.p)}, ${esc(x.s)}: <b>${fmt(x.sum)}</b> <span class="t">${esc(x.st)}</span></p>`).join(""):'<p class="mu">Заказов пока нет.</p>'}</div>${S.msg?`<div class="m">${esc(S.msg)}</div>`:""}<p><button class="pr" data-a="tab" data-v="home">Выбрать тариф</button> <button data-a="out">Выйти</button></p>`}
return`<h2>Вход</h2><div class="c" style="max-width:380px"><label>Логин<input id="lg" autocomplete="username"></label><label>Пароль<input id="pw" type="password" autocomplete="current-password"></label><button class="pr" data-a="in">Войти</button> <button data-a="reg">Регистрация</button>${S.msg?`<div class="m">${esc(S.msg)}</div>`:""}<p class="mu">Владелец сайта входит здесь же своим логином и паролем.</p></div>`};
const adm=()=>!S.adm?lock():`<h2>Панель владельца</h2><div class="c"><h3>Общие</h3><label>Название<input id="a_br" value="${esc(CFG.brand)}"></label><label>Ссылка на оплату (https://…, например Kaspi Pay)<input id="a_pay" value="${esc(CFG.pay)}"></label><label>Подпись у кнопки оплаты<input id="a_pn" value="${esc(CFG.payNote)}"></label></div>
<h3>Пакеты</h3><div class="g">${CFG.pk.map((p,i)=>`<div class="c"><label>Название<input id="a_n${i}" value="${esc(p.name)}"></label><label>Цена за раздел, ₸ / мес<input id="a_p${i}" type="number" value="${p.price}"></label><label>Что входит (по строке)<textarea id="a_f${i}" rows="5">${esc(p.feat.join("\n"))}</textarea></label></div>`).join("")}</div>
<h3>Скидки за несколько разделов, %</h3><div class="g">${[1,2,3,4].map(n=>`<label>${n} раздел(а)<input id="a_d${n}" type="number" value="${CFG.disc[n]||0}"></label>`).join("")}</div>
<div class="c"><h3>Доступ владельца</h3><label>Логин<input id="a_l" value="${esc(CFG.admLogin)}"></label><label>Новый пароль (пусто — не менять)<input id="a_w" type="password"></label>${CFG.admHash?"":'<p class="lm">⚠️ Сейчас пароль по умолчанию admin123 — смените его!</p>'}</div>
<p><button class="pr" data-a="save">Сохранить и опубликовать</button></p>${S.st?`<div class="m">${esc(S.st)}</div>`:""}`;
function render(){const T=[["home","Тарифы"],["menu","Подбор меню"],["lists","Продукты"],["cab",S.user?"👤 "+esc(S.user):"Вход"]];if(S.adm)T.push(["adm","Админ"]);
 $("#root").innerHTML=`<header><h1>🥦 ${esc(CFG.brand)}</h1><nav>${T.map(([k,t])=>`<button class="${S.tab===k?"on":""}" data-a="tab" data-v="${k}">${t}</button>`).join("")}</nav></header>${{home,menu,lists,cab,adm}[S.tab]()}`}
async function act(a,v){try{await act2(a,v)}catch(e){S.msg="Ошибка: "+(e.message||e);render()}}
async function act2(a,v){rpf();
 if(a==="tab"){S.tab=v;S.msg=""}
 else if(a==="sel"){S.sel=S.sel.includes(v)?S.sel.filter(x=>x!==v):S.sel.concat(v)}
 else if(a==="pk")S.pk=v;
 else if(a==="gd"){S.gen=S.gen.includes(v)?S.gen.filter(x=>x!==v):S.gen.concat(v);S.menu=null}
 else if(a==="pf"){S.menu=null}
 else if(a==="gen"){if(!S.gen.length)S.gen=["gf"];gen()}
 else if(a==="pay")return pay();
 else if(a==="out"){S.user=null;S.adm=false;S.tab="home"}
 else if(a==="in"||a==="reg"){const l=$("#lg").value.trim(),p=$("#pw").value;if(!l||p.length<6){S.msg="Введите логин и пароль (от 6 символов)";return render()}
  const h=await sha(p),u=ls.get("gf_u")||{};
  if(a==="in"&&l===CFG.admLogin&&h===(CFG.admHash||await sha("admin123"))){S.adm=true;S.user=null;S.tab="adm";S.msg=""}
  else if(a==="reg"){if(u[l]||l===CFG.admLogin)S.msg="Такой логин уже занят";else{u[l]={h,orders:[]};ls.set("gf_u",u);S.user=l;S.tab="cab";S.msg="Регистрация прошла успешно! Теперь выберите тариф и оплатите."}}
  else if(u[l]&&u[l].h===h){S.user=l;S.tab="cab";S.msg="Вы вошли в аккаунт."}else S.msg="Неверный логин или пароль"}
 else if(a==="save"){const g=i=>$("#"+i).value;CFG.brand=g("a_br")||CFG.brand;CFG.pay=g("a_pay").trim();CFG.payNote=g("a_pn");
  CFG.pk.forEach((p,i)=>{p.name=g("a_n"+i)||p.name;p.price=Math.max(0,+g("a_p"+i)||0);p.feat=g("a_f"+i).split("\n").map(s=>s.trim()).filter(Boolean)});
  [1,2,3,4].forEach(n=>CFG.disc[n]=Math.min(90,Math.max(0,+g("a_d"+n)||0)));
  CFG.admLogin=g("a_l").trim()||"admin";if(g("a_w")){if(g("a_w").length<6){S.st="Пароль — минимум 6 символов";return render()}CFG.admHash=await sha(g("a_w"))}else if(!CFG.admHash&&CFG.admLogin){}
  const ar=await (window.claude&&claude.use("artifact"));
  if(!ar){const b=new Blob(["window.SITE_CONFIG="+JSON.stringify(CFG,null,2)+";"],{type:"text/javascript"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="config.js";a.click();S.st="Скачан файл config.js. Загрузите его в репозиторий GitHub вместо старого — и новые цены увидят все.";return render()}
  try{const cl=document.documentElement.cloneNode(true);cl.querySelector("#root").innerHTML="";const sc=cl.querySelector("#app");
   sc.textContent=sc.textContent.replace(/\/\*CFG\*\/[\s\S]*?\/\*END\*\//,()=>"/*CFG*/"+JSON.stringify(CFG).replace(/</g,"\\u003c")+"/*END*/");
   S.st="Публикую…";render();await ar.publish("<!doctype html>\n"+cl.outerHTML)}catch(e){S.st="Не удалось опубликовать: "+(e.message||e.code||e)}}
 render()}
$("#root").addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&t.type!=="checkbox"){act(t.dataset.a,t.dataset.v)}});
$("#root").addEventListener("change",e=>{const t=e.target;if(t.type==="checkbox"&&t.dataset.a)act(t.dataset.a,t.dataset.v)});
render();
</script></body></html>
